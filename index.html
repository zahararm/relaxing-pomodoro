<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Relaxing Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-mode="night" data-char="awake">
    <div id="bar">
        <button class="mb" data-m="morning" aria-label="morning mode">
            <svg viewBox="0 0 40 40" width="38">
                <circle cx="20" cy="20" r="8" fill="#ffb81c" stroke="#2a1d1a" stroke-width="2.5"/>
                <path d="M20 4v5M20 31v5M4 20h5M31 20h5M8.7 8.7l3.5 3.5M27.8 27.8l3.5 3.5M31.3 8.7l-3.5 3.5M12.2 27.8l-3.5 3.5" stroke="#2a1d1a" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span class="tl">morning</span>
        </button>
        <button class="mb on" data-m="night" aria-label="night mode">
            <svg viewBox="0 0 40 40" width="38">
                <path d="M25 5a15 15 0 1 0 10 22A12 12 0 0 1 25 5z" fill="#cfd8ff" stroke="#2a1d1a" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M30 10l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#ffb81c"/>
            </svg>
            <span class="tl">night</span>
        </button>
    </div>

    <div id="snd"> enjoy your study sesh! </div>
    <div id="toast"></div>

    <div id="pomoCard">
        <div id="pomoLabel">Focus</div>
        <div id="pomoTime">25:00</div>
        <div class="pomoBtns">
            <button id="pomoStart">Start</button>
            <button id="pomoReset" aria-label="reset">↺</button>
        </div>
        <div id="pomoCount"></div>
    </div>

    <div id="mixer">
        <div class="mxTitle">Ambience</div>
        <div class="mx" data-id="rain"><button class="mxBtn" aria-label="toggle rain">🌧️<span>Rain</span></button></div>
        <div class="mx" data-id="waves"><button class="mxBtn" aria-label="toggle beach waves">🌊<span>Waves</span></button></div>
        <div class="mx" data-id="fire"><button class="mxBtn" aria-label="toggle fireplace">🔥<span>Fire</span></button></div>
    </div>

    <div style="display:none;">
       <audio id="audio-rain" src="rain-ambience.mp3" loop></audio>
        <audio id="audio-waves" src="waves-ambience.mp3" loop></audio>
        <audio id="audio-fire" src="fire-ambience.mp3" loop></audio>
    </div>

    <div id="taskCard">
        <div class="tcTitle" id="taskToggle">Today</div>
        <form id="taskForm"><input id="taskInput" placeholder="add a task…" autocomplete="off"><button type="submit">+</button></form>
        <ul id="taskList"></ul>
    </div>
    
    <svg id="room" viewBox="0 0 1621 903" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Relaxing Pomodoro">
        <defs>
            <radialGradient id="gl">
                <stop offset="0" stop-color="#ffc766" stop-opacity=".55"/>
                <stop offset="1" stop-color="#ffc766" stop-opacity="0"/>
            </radialGradient>
            <clipPath id="win">
                <rect x="320" y="50" width="1040" height="540"/>
            </clipPath>
        </defs>
        <g id="scene">
            <rect x="-1200" y="-800" width="4000" height="2600" fill="var(--wall)"/>
            <rect x="-1200" y="610" width="4000" height="293" fill="#0003"/>
            <rect x="-1200" y="903" width="4000" height="900" fill="#1a1210"/>
            <rect x="320" y="50" width="1040" height="550" fill="url(#sky)"/>
            <g clip-path="url(#win)">
                <g id="stars" fill="#fff">
                    <circle cx="400" cy="100" r="2"/>
                    <circle cx="520" cy="180" r="2"/>
                    <circle cx="700" cy="90" r="1.6"/>
                    <circle cx="930" cy="130" r="2"/>
                    <circle cx="1120" cy="100" r="2"/>
                    <circle cx="1280" cy="190" r="1.6"/>
                </g>
                <circle id="sun" cx="1120" cy="250" r="48" fill="#fff4cf"/>
                <g id="city" fill="var(--city)"></g>
                <path fill="var(--cath)" d="M500 600V480H530V340H550V220H570V160L580 100L590 160V220H610V340H630V480H660V600Z"/>
                <g id="lit"></g>
                <g id="rain"></g>
            </g>
            <rect x="320" y="50" width="1040" height="550" rx="6" fill="none" stroke="#7a4e2d" stroke-width="22"/>
            <rect x="833" y="50" width="14" height="550" fill="#7a4e2d"/>
            <rect x="300" y="596" width="1080" height="22" rx="4" fill="#5e3a20"/>

            <polygon points="18,22 300,76 18,130" fill="#003594" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
            <text x="44" y="76" dominant-baseline="central" font-family="Arial Black, Arial" font-weight="900" font-size="27" fill="#ffb81c" textLength="155" lengthAdjust="spacingAndGlyphs">H2P!</text>
            <circle cx="18" cy="22" r="4" fill="#ccc"/>
            <circle cx="18" cy="130" r="4" fill="#ccc"/>
            <rect x="29" y="155" width="240" height="188" rx="6" fill="#0003"/>

                <rect x="1536" y="200" width="64" height="64" fill="#ffb3c7"/>

            <g transform="rotate(-4 1485 256)">
                <rect x="1448" y="220" width="72" height="72" fill="#a9d4ff"/>

            <rect x="1410" y="340" width="190" height="563" rx="6" fill="#5a3b25" stroke="#3d2716" stroke-width="6"/>
            <g id="case"></g>
            
            <!-- Desk -->
            <polygon points="300,705 1370,705 1410,815 250,815" fill="var(--desk)"/>
            <rect x="250" y="815" width="1160" height="22" fill="var(--desk)"/>
            <rect x="250" y="815" width="1160" height="22" fill="#0003"/>
            <rect x="250" y="837" width="1160" height="66" fill="var(--desk)"/>

            <rect x="1160" y="690" width="132" height="38" rx="4" fill="#7a2f3a"/>

            <g id="lampGroup">
                <ellipse cx="350" cy="722" rx="50" ry="13" fill="#8a4a1f"/>

                <circle cx="334" cy="592" r="8" fill="#7a3f18"/>

            <!-- Mug -->
            <rect x="436" y="692" width="48" height="40" rx="7" fill="#f4f0e6"/>
            <path d="M484 702q18 4 0 20" stroke="#f4f0e6" stroke-width="6" fill="none"/>
            <path class="steam" d="M452 685q-10-20 0-35q10-15 0-30" stroke="#fff" stroke-width="4" fill="none" opacity=".6"/>

            <g id="computerSetup">
                <rect x="610" y="650" width="360" height="90" rx="10" fill="#2b303c" opacity=".8"/>
                <rect x="740" y="670" width="150" height="12" rx="4" fill="#3b4252" stroke="#1e222b" stroke-width="2"/>

                    <circle cx="18" cy="6" r="3" fill="#ffbd2e"/>

                    <path d="M10 28h80M10 44h140M10 60h100M10 76h120" stroke="#88c0d0" stroke-width="4" stroke-linecap="round"/>

                </g>
                <ellipse cx="920" cy="710" rx="12" ry="16" fill="#4c566a" stroke="#1e222b" stroke-width="2"/>
            </g>

            <g id="awake">
                <path d="M690 772C685 680 720 585 760 575H840C880 585 915 680 910 772Z" fill="var(--shirt)"/>

                <ellipse cx="800" cy="470" rx="56" ry="64" fill="#8d5b4c" stroke="#2a1d1a" stroke-width="2.5"/>

                <g fill="#231715" stroke="#2a1d1a" stroke-width="2.5">

                    <circle cx="800" cy="370" r="55"/>

                <rect x="864" y="445" width="34" height="66" rx="14" fill="#ffb81c" stroke="#2a1d1a" stroke-width="2.5"/>
            </g>
